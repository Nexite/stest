# STM32L496RG chip package for stest.
# Base addresses and the IRQ list follow ST's CMSIS device header stm32l496xx.h
# (cmsis_device_l4); handler names are <name>_IRQHandler as in ST's startup file.
# Core exceptions (NMI..SysTick) are implicit.

[chip]
name = "STM32L496RG"
family = "stm32l4"
core = "cortex-m4"
nvic_prio_bits = 4
device_define = "STM32L496xx"
# CMSIS SystemInit() runs on the firmware thread before main (like Reset_Handler).
system_init = "SystemInit"
# SysTick CLKSOURCE=0 is HCLK/8 on STM32L4.
systick_external_divider = 8

# Clock-tree model and the RCC enable registers that rcc_enable may name (RM0351 6.4).
# A peripheral with rcc_enable aborts on any access while that bit is clear.
[clock_tree]
peripheral = "RCC"
enable_regs = { AHB1ENR = 0x48, AHB2ENR = 0x4C, AHB3ENR = 0x50, APB1ENR1 = 0x58, APB1ENR2 = 0x5C, APB2ENR = 0x60 }

[[peripheral]]
name = "RCC"
model = "stm32l4.rcc"
base = 0x40021000
size = 0x400

[[peripheral]]
name = "PWR"
model = "stm32l4.pwr"
base = 0x40007000
size = 0x400
rcc_enable = { reg = "APB1ENR1", bit = 28 }

# SYSCFG (EXTI port selection) is clocked from APB2ENR bit 0; EXTI itself is always clocked.
[[peripheral]]
name = "SYSCFG"
model = "stm32l4.syscfg"
base = 0x40010000
size = 0x400
rcc_enable = { reg = "APB2ENR", bit = 0 }

# EXTI lines 0-15 (GPIO) and the NVIC IRQ each one pends: EXTI0..4, EXTI9_5, EXTI15_10.
[[peripheral]]
name = "EXTI"
model = "stm32l4.exti"
base = 0x40010400
size = 0x400
params = { irq = [6, 7, 8, 9, 10, 23, 23, 23, 23, 23, 40, 40, 40, 40, 40, 40] }

[[peripheral]]
name = "FLASH"
model = "stm32l4.flash"
base = 0x40022000
size = 0x400

# GPIO reset values (RM0351): ports A/B have the debug pins configured.
[[peripheral]]
name = "GPIOA"
model = "stm32l4.gpio"
base = 0x48000000
size = 0x400
rcc_enable = { reg = "AHB2ENR", bit = 0 }
params = { port = "A", moder_reset = 0xABFFFFFF, ospeedr_reset = 0x0C000000, pupdr_reset = 0x64000000 }

[[peripheral]]
name = "GPIOB"
model = "stm32l4.gpio"
base = 0x48000400
size = 0x400
rcc_enable = { reg = "AHB2ENR", bit = 1 }
params = { port = "B", moder_reset = 0xFFFFFEBF, ospeedr_reset = 0x000000C0, pupdr_reset = 0x00000100 }

[[peripheral]]
name = "GPIOC"
model = "stm32l4.gpio"
base = 0x48000800
size = 0x400
rcc_enable = { reg = "AHB2ENR", bit = 2 }
params = { port = "C" }

[[peripheral]]
name = "GPIOD"
model = "stm32l4.gpio"
base = 0x48000C00
size = 0x400
rcc_enable = { reg = "AHB2ENR", bit = 3 }
params = { port = "D" }

[[peripheral]]
name = "GPIOE"
model = "stm32l4.gpio"
base = 0x48001000
size = 0x400
rcc_enable = { reg = "AHB2ENR", bit = 4 }
params = { port = "E" }

[[peripheral]]
name = "GPIOF"
model = "stm32l4.gpio"
base = 0x48001400
size = 0x400
rcc_enable = { reg = "AHB2ENR", bit = 5 }
params = { port = "F" }

[[peripheral]]
name = "GPIOG"
model = "stm32l4.gpio"
base = 0x48001800
size = 0x400
rcc_enable = { reg = "AHB2ENR", bit = 6 }
params = { port = "G" }

[[peripheral]]
name = "GPIOH"
model = "stm32l4.gpio"
base = 0x48001C00
size = 0x400
rcc_enable = { reg = "AHB2ENR", bit = 7 }
params = { port = "H" }

[[peripheral]]
name = "GPIOI"
model = "stm32l4.gpio"
base = 0x48002000
size = 0x400
rcc_enable = { reg = "AHB2ENR", bit = 8 }
params = { port = "I" }

# External interrupts: IRQn from stm32l496xx.h (79 is reserved).
