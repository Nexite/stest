[project]
name = "stest"
version = "0.1.0"
description = "STM32 software-in-the-loop simulator: Python test harness"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyelftools>=0.33",
]

[project.optional-dependencies]
# DBC support (stest.Dbc / DbcDevice): cantools, which depends on python-can (LGPL-3.0).
dbc = ["cantools>=41"]

[project.entry-points.pytest11]
stest = "stest.pytest_plugin"

[dependency-groups]
dev = ["pytest>=8", "cantools>=41"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/stest"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = [
    "perf: wall-clock speed budget (load-sensitive; CTest runs these alone in python_perf_tests, RUN_SERIAL)",
]
